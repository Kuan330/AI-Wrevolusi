        <g><rect x="560" y="272" width="132" height="96" rx="8" fill="#fff" stroke="#574a55" /><text x="626" y="312" class="name" text-anchor="middle">FastAPI routers</text><text x="626" y="332" class="sub" text-anchor="middle">/api/v1</text><text x="626" y="348" class="sub" text-anchor="middle">auth · tasks · reference</text></g>
        <g><rect x="704" y="272" width="164" height="96" rx="8" fill="#eef6fb" stroke="#4f91ba" stroke-width="1.2" /><text x="786" y="312" class="name" text-anchor="middle">Application services</text><text x="786" y="332" class="sub" text-anchor="middle">exposure · capability</text><text x="786" y="348" class="sub" text-anchor="middle">preparation · schedule</text></g>
        <g><rect x="416" y="416" width="212" height="104" rx="8" fill="#eef6fb" stroke="#4f91ba" stroke-width="1.2" /><text x="522" y="452" class="name" text-anchor="middle">Explainable NLP exposure</text><text x="522" y="472" class="sub" text-anchor="middle">exact ILO match · TF-IDF</text><text x="522" y="488" class="sub" text-anchor="middle">cosine similarity · context adjustment</text><text x="522" y="504" class="sub" text-anchor="middle">source · uncertainty · limitations</text></g>
        <g><rect x="656" y="416" width="212" height="104" rx="8" fill="#fff" stroke="#574a55" /><text x="762" y="452" class="name" text-anchor="middle">Domain services</text><text x="762" y="472" class="sub" text-anchor="middle">auth · users · occupations</text><text x="762" y="488" class="sub" text-anchor="middle">tasks · capabilities</text><text x="762" y="504" class="sub" text-anchor="middle">preparation · schedules</text></g>

        <g><rect x="948" y="152" width="132" height="72" rx="8" fill="#f8f1f3" stroke="#a88d9c" stroke-dasharray="4 4" /><text x="1014" y="184" class="name" text-anchor="middle">Source datasets</text><text x="1014" y="204" class="sub" text-anchor="middle">MASCO · ILO · WEF</text></g>
        <g><rect x="1092" y="152" width="124" height="72" rx="8" fill="#f8f1f3" stroke="#a88d9c" stroke-dasharray="4 4" /><text x="1154" y="184" class="name" text-anchor="middle">Seed pipeline</text><text x="1154" y="204" class="sub" text-anchor="middle">validate · upsert</text></g>
        <g><rect x="948" y="272" width="132" height="96" rx="8" fill="#fff" stroke="#574a55" /><text x="1014" y="312" class="name" text-anchor="middle">Data access</text><text x="1014" y="332" class="sub" text-anchor="middle">SQLAlchemy 2.x</text><text x="1014" y="348" class="sub" text-anchor="middle">AsyncSession · asyncpg</text></g>
        <g><rect x="1092" y="272" width="124" height="96" rx="8" fill="#eef6fb" stroke="#4f91ba" stroke-width="1.2" /><text x="1154" y="312" class="name" text-anchor="middle">Neon</text><text x="1154" y="332" class="name" text-anchor="middle">PostgreSQL</text><text x="1154" y="352" class="sub" text-anchor="middle">managed database</text></g>
