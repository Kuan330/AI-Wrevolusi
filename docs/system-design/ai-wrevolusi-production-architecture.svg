        <g><rect x="64" y="152" width="272" height="96" rx="8" fill="#fff" stroke="#a88d9c" /><rect x="76" y="164" width="56" height="16" rx="4" fill="#f9e0e4" /><text x="104" y="176" class="tag" text-anchor="middle">REACT UI</text><text x="200" y="196" class="name" text-anchor="middle">Product routes</text><text x="200" y="216" class="sub" text-anchor="middle">Home · Work Profile · Task Confirmation</text><text x="200" y="232" class="sub" text-anchor="middle">Dashboard · supporting journey pages</text></g>
        <g><rect x="64" y="272" width="128" height="96" rx="8" fill="#f8f1f3" stroke="#a88d9c" /><text x="128" y="312" class="name" text-anchor="middle">Client state</text><text x="128" y="332" class="sub" text-anchor="middle">occupation</text><text x="128" y="348" class="sub" text-anchor="middle">confirmed analysis</text></g>
        <g><rect x="208" y="272" width="128" height="96" rx="8" fill="#fff" stroke="#574a55" /><text x="272" y="312" class="name" text-anchor="middle">API adapters</text><text x="272" y="332" class="sub" text-anchor="middle">typed fetch</text><text x="272" y="348" class="sub" text-anchor="middle">4s timeout · fallback</text></g>

        <g><rect x="416" y="152" width="132" height="72" rx="8" fill="#fff" stroke="#574a55" /><text x="482" y="184" class="name" text-anchor="middle">Vercel frontend</text><text x="482" y="204" class="sub" text-anchor="middle">Vite · SPA fallback</text></g>
        <g><rect x="560" y="152" width="132" height="72" rx="8" fill="#fff" stroke="#574a55" /><text x="626" y="184" class="name" text-anchor="middle">Pydantic</text><text x="626" y="204" class="sub" text-anchor="middle">request contracts</text></g>
        <g><rect x="704" y="152" width="164" height="72" rx="8" fill="#fff" stroke="#574a55" /><text x="786" y="184" class="name" text-anchor="middle">System health</text><text x="786" y="204" class="sub" text-anchor="middle">GET /api/healthz</text></g>
