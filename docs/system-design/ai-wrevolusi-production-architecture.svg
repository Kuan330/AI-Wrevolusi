<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="aiw-production-architecture-title aiw-production-architecture-desc">
        <title id="aiw-production-architecture-title">Detailed AI-Wrevolusi production architecture</title>
        <desc id="aiw-production-architecture-desc">Detailed architecture showing React routes and browser state, Vercel frontend and API routing, FastAPI validation and explainable NLP services, plus async data access and PostgreSQL tables populated from curated MASCO, ILO and WEF sources.</desc>
        <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <style>
            .zone-label { fill: #7f7280; font: 500 8px 'Geist Mono', monospace; letter-spacing: 1.2px; }
            .tag { fill: #7f7280; font: 500 8px 'Geist Mono', monospace; }
            .name { fill: #2f2430; font: 600 14px 'Geist', sans-serif; }
            .sub { fill: #574a55; font: 400 9px 'Geist Mono', monospace; }
            .flow-label { fill: #4f91ba; font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.5px; }
          </style>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#7f7280" /></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#4f91ba" /></marker>
        </defs>

        <rect width="1280" height="720" fill="#fbf7f8" />
        <text x="40" y="44" class="zone-label">SYSTEM DESIGN · CURRENT PRODUCTION</text>
        <text x="40" y="80" fill="#2f2430" font-family="'Instrument Serif', serif" font-size="40">Detailed runtime and data boundaries</text>

        <rect x="40" y="104" width="320" height="516" rx="8" fill="rgba(199,149,139,0.04)" stroke="rgba(47,36,48,0.12)" />
        <rect x="392" y="104" width="500" height="516" rx="8" fill="rgba(79,145,186,0.04)" stroke="rgba(47,36,48,0.12)" />
        <rect x="924" y="104" width="316" height="516" rx="8" fill="rgba(79,145,186,0.04)" stroke="rgba(47,36,48,0.12)" />
        <rect x="56" y="108" width="120" height="16" rx="4" fill="#fbf7f8" /><text x="64" y="120" class="zone-label">BROWSER LAYER</text>
        <rect x="408" y="108" width="120" height="16" rx="4" fill="#fbf7f8" /><text x="416" y="120" class="zone-label">SERVICE LAYER</text>
        <rect x="940" y="108" width="104" height="16" rx="4" fill="#fbf7f8" /><text x="948" y="120" class="zone-label">DATA LAYER</text>

