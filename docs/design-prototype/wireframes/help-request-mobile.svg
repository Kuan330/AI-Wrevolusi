t="spacingAndGlyphs">sent from this website.</text></g><g id="texts-10" clip-path="url(#clip-18)"><text x="138.609" y="649.317" font-family="Inter, Outfit, system-ui, sans-serif" font-size="13" font-weight="400" fill="#333333" xml:space="preserve" textLength="112.781" lengthAdjust="spacingAndGlyphs">Save request draft</text></g><g id="texts-11" clip-path="url(#clip-19)"><text x="364" y="205.222" font-family="Inter, Outfit, system-ui, sans-serif" font-size="16" font-weight="400" fill="#333333" xml:space="preserve" textLength="42.938" lengthAdjust="spacingAndGlyphs">Close</text></g></g></svg>