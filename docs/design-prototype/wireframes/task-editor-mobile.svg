 xml:space="preserve" textLength="296.797" lengthAdjust="spacingAndGlyphs">information later, when you record an AI trial.</text></g><g id="texts-4" clip-path="url(#clip-18)"><text x="25" y="161.843" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#333333" xml:space="preserve" textLength="112.062" lengthAdjust="spacingAndGlyphs">Task description</text></g><g id="texts-5" clip-path="url(#clip-19)"><text x="38" y="201.603" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="400" fill="#333333" xml:space="preserve">Planning and preparing work schedules and</text><text x="38" y="221.603" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="400" fill="#333333" xml:space="preserve">assigning staff to specific duties;</text></g><g id="texts-6" clip-path="url(#clip-20)"><text x="25" y="307.843" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#333333" xml:space="preserve" textLength="138.406" lengthAdjust="spacingAndGlyphs">Standard task check</text></g><g id="texts-7" clip-path="url(#clip-21)"><text x="42" y="343.843" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="500" fill="#333333" xml:space="preserve" textLength="175.469" lengthAdjust="spacingAndGlyphs">Find closest standard task</text></g><g id="texts-8" clip-path="url(#clip-22)"><text x="25" y="379.323" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve" textLength="308.297" lengthAdjust="spacingAndGlyphs">Compare your wording with the occupation's standard</text></g><g id="texts-9" clip-path="url(#clip-23)"><text x="25" y="399.323" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve" textLength="289.641" lengthAdjust="spacingAndGlyphs">task list. Suggestions need your review before they</text></g><g id="texts-10" clip-path="url(#clip-24)"><text x="25" y="419.323" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve" textLength="35.625" lengthAdjust="spacingAndGlyphs">count.</text></g><g id="texts-11" clip-path="url(#clip-25)"><text x="25" y="455.843" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#333333" xml:space="preserve" textLength="173.422" lengthAdjust="spacingAndGlyphs">Task frequency (optional)</text></g><g id="texts-12" clip-path="url(#clip-26)"><text x="42" y="497.843" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="400" fill="#333333" xml:space="preserve" textLength="88.281" lengthAdjust="spacingAndGlyphs">Not specified</text></g><g id="texts-13" clip-path="url(#clip-27)"><text x="25" y="539.323" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve" textLength="322.422" lengthAdjust="spacingAndGlyphs">How often you do this task, rather than how long it takes.</text></g><g id="texts-14" clip-path="url(#clip-28)"><text x="25" y="575.843" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#333333" xml:space="preserve" textLength="311.078" lengthAdjust="spacingAndGlyphs">Anything specific about how you do this task?</text></g><g id="texts-15" clip-path="url(#clip-29)"><text x="25" y="595.843" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#333333" xml:space="preserve" textLength="65.172" lengthAdjust="spacingAndGlyphs">(optional)</text></g><g id="texts-16" clip-path="url(#clip-30)"><text x="25" y="733.323" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve" textLength="322.875" lengthAdjust="spacingAndGlyphs">For example, the software you use, what you produce, or</text></g><g id="texts-17" clip-path="url(#clip-31)"><text x="25" y="753.323" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve" textLength="121.641" lengthAdjust="spacingAndGlyphs">special requirements.</text></g><g id="texts-18" clip-path="url(#clip-32)"><text x="140.594" y="797.843" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="500" fill="#333333" xml:space="preserve" textLength="93.812" lengthAdjust="spacingAndGlyphs">Save changes</text></g><g id="texts-19" clip-path="url(#clip-33)"><text x="349" y="92.363" font-family="Inter, Outfit, system-ui, sans-serif" font-size="16" font-weight="400" fill="#333333" xml:space="preserve" textLength="42.938" lengthAdjust="spacingAndGlyphs">Close</text></g></g></svg>