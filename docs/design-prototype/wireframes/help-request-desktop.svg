otype helper</text></g><g id="texts-5" clip-path="url(#clip-13)"><text x="489" y="478.37" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve" textLength="51.609" lengthAdjust="spacingAndGlyphs">Message</text></g><g id="texts-6" clip-path="url(#clip-14)"><text x="500" y="512.45" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve">Hi Prototype helper, could you help with “Prototype example: school</text><text x="500" y="530.45" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve">pickup” on 2026-09-16, 18:15–19:00 (Asia/Kuala_Lumpur)? Please reply to</text><text x="500" y="548.45" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve">confirm whether you can take this on. Thank you!</text></g><g id="texts-7" clip-path="url(#clip-15)"><text x="489" y="660.37" font-family="Inter, Outfit, system-ui, sans-serif" font-size="12" font-weight="400" fill="#333333" xml:space="preserve" textLength="460.469" lengthAdjust="spacingAndGlyphs">You will choose the recipient in WhatsApp. No message is sent from this website.</text></g><g id="texts-8" clip-path="url(#clip-16)"><text x="663.609" y="705.724" font-family="Inter, Outfit, system-ui, sans-serif" font-size="13" font-weight="400" fill="#333333" xml:space="preserve" textLength="112.781" lengthAdjust="spacingAndGlyphs">Save request draft</text></g><g id="texts-9" clip-path="url(#clip-17)"><text x="950" y="304.816" font-family="Inter, Outfit, system-ui, sans-serif" font-size="16" font-weight="400" fill="#333333" xml:space="preserve" textLength="42.938" lengthAdjust="spacingAndGlyphs">Close</text></g></g></svg>