irements.</text></g><g id="texts-15" clip-path="url(#clip-31)"><text x="753.719" y="828.64" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="500" fill="#4f91ba" xml:space="preserve" fill-opacity="1" textLength="46.469" lengthAdjust="spacingAndGlyphs">Cancel</text></g><g id="texts-16" clip-path="url(#clip-32)"><text x="841.188" y="828.64" font-family="Inter, Outfit, system-ui, sans-serif" font-size="14" font-weight="500" fill="#ffffff" xml:space="preserve" fill-opacity="1" textLength="93.812" lengthAdjust="spacingAndGlyphs">Save changes</text></g><g id="texts-17" clip-path="url(#clip-33)"><text x="950" y="183.16" font-family="Inter, Outfit, system-ui, sans-serif" font-size="16" font-weight="400" fill="#3c2a35" xml:space="preserve" fill-opacity="1" textLength="42.938" lengthAdjust="spacingAndGlyphs">Close</text></g></g></svg>