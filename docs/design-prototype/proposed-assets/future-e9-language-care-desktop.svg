<text x="751" y="755" fill="#2F2430" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">You can come back later</text>
<text x="751" y="783" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">This preview shows the intended return experience.</text>
<text x="751" y="806" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">It does not verify storage or reminders.</text>
<text x="120" y="937" fill="#3D5F7A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500">E9 · Supported languages, translation review, reminder channels and delivery commitment remain undecided.</text>
