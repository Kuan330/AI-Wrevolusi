<text x="148" y="679" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Keep my selected skill and learning goal.</text>
<text x="148" y="709" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Keep my chosen chapters and study times.</text>
