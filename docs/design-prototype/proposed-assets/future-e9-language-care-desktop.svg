<text x="148" y="558" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Use shorter explanations and show one next step.</text>
<text x="148" y="584" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Keep a way to read the full detail.</text>
