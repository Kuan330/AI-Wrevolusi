<text x="159" y="583" fill="#3D5F7A" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Analytical thinking</text>
<text x="148" y="650" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">You can correct this starting point.</text>
<text x="148" y="675" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">These examples do not assess your</text>
<text x="148" y="700" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">ability or predict employment.</text>
