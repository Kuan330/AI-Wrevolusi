<text x="548" y="380" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">Explore how teams organise sales processes and use records.</text>
<text x="1250" y="365" fill="#4F91BA" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400">●</text>
<rect x="527" y="432" width="765" height="99" rx="17" fill="#FCFCFE" stroke="#D9DDE5"/>
<text x="548" y="466" fill="#2F2430" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Customer success</text>
<text x="548" y="496" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">Explore how teams support customers and keep relationships.</text>
<text x="1250" y="481" fill="#4F91BA" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400">○</text>
<rect x="527" y="548" width="765" height="99" rx="17" fill="#FCFCFE" stroke="#D9DDE5"/>
<text x="548" y="582" fill="#2F2430" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Business reporting</text>
<text x="548" y="612" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">Explore how teams turn work records into useful explanations.</text>
<text x="1250" y="597" fill="#4F91BA" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400">○</text>
<text x="527" y="703" fill="#2F2430" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">For this direction, explore</text>
<text x="527" y="733" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Process improvement · Clear reporting · Working with data</text>
<text x="527" y="760" fill="#706976" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Check real role descriptions and requirements before deciding.</text>
<rect x="1042" y="801" width="250" height="44" rx="23" fill="#3D5F7A"/>
<text x="1058" y="829" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550">Explore skills for this direction</text>
<text x="120" y="937" fill="#3D5F7A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500">E7 · Exploration only. These examples are not career advice, verified vacancies or an employment prediction.</text>
