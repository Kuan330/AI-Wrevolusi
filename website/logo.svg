<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="AI-Wrevolusi logo">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8def"/>
      <stop offset="55%" stop-color="#9b7be8"/>
      <stop offset="100%" stop-color="#ff9eb5"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#5b8def" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Icon: stylized pen nib + rising line -->
  <g transform="translate(4, 4)" filter="url(#softShadow)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#brandGrad)"/>
    <!-- pen body -->
    <path d="M20 7 L28 17 L20 33 L12 17 Z" fill="#ffffff" opacity="0.95"/>
    <!-- pen nib dot/hole -->
    <circle cx="20" cy="17" r="2.2" fill="url(#brandGrad)"/>
    <!-- rising line / ink flow -->
    <path d="M27 26 Q31 22 33 15" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
    <circle cx="33" cy="15" r="1.6" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="52" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#3a3a5c" letter-spacing="-0.2">AI-Wrevolusi</text>
  <text x="52" y="39" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#6e6e8f">Reshape your work with AI</text>
  <circle cx="146" cy="21" r="2.5" fill="#ff9eb5"/>
</svg>