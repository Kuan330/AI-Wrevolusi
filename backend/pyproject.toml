[project]
name = "ai-wrevolusi-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg",
    "email-validator",
    "fastapi",
    "pwdlib[argon2]",
    "pydantic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "python-multipart",
    "scikit-learn==1.9.0",
    "sqlalchemy[asyncio]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
